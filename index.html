<script>
  "use strict";

  // =========================================================
  // EL PLAN JABA — CATÁLOGO CONECTADO A SUPABASE
  // =========================================================

  const SUPABASE_URL = "https://gwqjtmhxirfpqvwhbnnf.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_76ECz_XYb-egjAv8L2J0ag_2HkPnHmf";

  const STORAGE_BUCKET = "Productos";
  const CART_STORAGE_KEY = "elPlanJaba.cart.v2";
  const WHATSAPP_NUMBER = "5352086841";

  const products = [];
  const cart = new Map();

  let selectedCategory = "Todos";
  let searchTerm = "";

  const grid = document.getElementById("product-grid");
  const cartOverlay = document.getElementById("cart-overlay");

  // ---------------------------------------------------------
  // INICIAR SUPABASE
  // ---------------------------------------------------------

  const cliente = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  // ---------------------------------------------------------
  // UTILIDADES
  // ---------------------------------------------------------

  function textoSeguro(valor) {
    return String(valor ?? "");
  }

  function escaparHTML(valor) {
    return textoSeguro(valor).replace(/[&<>"']/g, caracter => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[caracter]);
  }

  function formatoPrecio(valor) {
    return Number(valor || 0).toLocaleString("es-ES", {
      maximumFractionDigits: 2
    });
  }

  function obtenerFoto(ruta) {
    if (!ruta) return "";

    // Si ya es una URL completa, se utiliza directamente.
    if (/^https?:\/\//i.test(ruta)) return ruta;

    // Convierte la ruta almacenada en Supabase en URL pública.
    const rutaCodificada = String(ruta)
      .split("/")
      .map(segmento => encodeURIComponent(segmento))
      .join("/");

    return `${SUPABASE_URL}/storage/v1/object/public/` +
      `${STORAGE_BUCKET}/${rutaCodificada}`;
  }

  // ---------------------------------------------------------
  // CARGAR EL CATÁLOGO REAL
  // ---------------------------------------------------------

  async function cargarProductos() {
    grid.innerHTML =
      '<div class="empty">Cargando catálogo...</div>';

    try {
      const { data, error } = await cliente
        .from("productos")
        .select(`
          id,
          codigo,
          nombre,
          descripcion,
          categoria_id,
          precio,
          existencia,
          imagen_url,
          activo,
          subcategoria,
          presentacion,
          marca,
          categoria:categorias(nombre)
        `)
        .eq("activo", true)
        .order("nombre");

      if (error) throw error;

      products.splice(
        0,
        products.length,
        ...(data || []).map(fila => ({
          id: String(fila.codigo),
          code: String(fila.codigo || ""),
          name: textoSeguro(fila.nombre),
          category: textoSeguro(fila.categoria?.nombre),
          subcategory: textoSeguro(fila.subcategoria),
          description: textoSeguro(fila.descripcion),
          presentation: textoSeguro(fila.presentacion),
          brand: textoSeguro(fila.marca),
          price: Number(fila.precio || 0),
          stock: Number(fila.existencia || 0),
          photo: obtenerFoto(fila.imagen_url),
          status: fila.activo ? "Act" : ""
        }))
      );

      restaurarCarrito();
      renderProducts();
      renderCart();

    } catch (error) {
      console.error("Error cargando el catálogo:", error);

      grid.innerHTML = `
        <div class="empty">
          No se pudo cargar el catálogo.
          Comprueba los permisos de lectura de la tabla
          productos en Supabase.
        </div>`;

      renderCart();
    }
  }

  // ---------------------------------------------------------
  // RECUPERAR EL CARRITO GUARDADO
  // ---------------------------------------------------------

  function restaurarCarrito() {
    cart.clear();

    try {
      const guardado = JSON.parse(
        localStorage.getItem(CART_STORAGE_KEY) || "[]"
      );

      if (!Array.isArray(guardado)) return;

      guardado.forEach(([id, cantidad]) => {
        const codigo = String(id);
        const unidades = Number(cantidad);
        const producto = products.find(p => p.id === codigo);

        if (
          producto &&
          Number.isInteger(unidades) &&
          unidades > 0 &&
          producto.stock > 0
        ) {
          cart.set(
            codigo,
            Math.min(unidades, producto.stock)
          );
        }
      });
    } catch (error) {
      console.warn("No se pudo recuperar el carrito.", error);
    }
  }

  function guardarCarrito() {
    try {
      localStorage.setItem(
        CART_STORAGE_KEY,
        JSON.stringify([...cart.entries()])
      );
    } catch (error) {
      console.warn("No se pudo guardar el carrito.", error);
    }
  }

  // ---------------------------------------------------------
  // MOSTRAR PRODUCTOS Y FOTOGRAFÍAS
  // ---------------------------------------------------------

  function renderProducts() {
    const filtrados = products.filter(producto => {
      const coincideCategoria =
        selectedCategory === "Todos" ||
        producto.category === selectedCategory;

      const textoBusqueda = [
        producto.name,
        producto.code,
        producto.brand,
        producto.subcategory,
        producto.description
      ].join(" ").toLowerCase();

      const coincideBusqueda =
        textoBusqueda.includes(searchTerm);

      return coincideCategoria && coincideBusqueda;
    });

    if (filtrados.length === 0) {
      grid.innerHTML =
        '<div class="empty">No encontramos productos con esa búsqueda.</div>';
      return;
    }

    grid.innerHTML = filtrados.map(producto => {
      const cantidad = cart.get(producto.id) || 0;
      const agotado = producto.stock <= 0;

      return `
        <article class="product-card">
          <div class="product-art">
            ${
              producto.photo
                ? `
                  <img
                    class="product-photo"
                    src="${escaparHTML(producto.photo)}"
                    alt="${escaparHTML(producto.name)}"
                    loading="lazy"
                    onerror="
                      this.style.display='none';
                      this.nextElementSibling.style.display='grid';
                    "
                  >
                  <div
                    class="photo-placeholder"
                    style="display:none"
                    aria-label="Foto no disponible"
                  >🛍️</div>
                `
                : `
                  <div
                    class="photo-placeholder"
                    aria-label="Foto no disponible"
                  >🛍️</div>
                `
            }
          </div>

          <div class="product-info">
            <div class="product-category">
              ${escaparHTML(producto.category)}
            </div>

            <h3>${escaparHTML(producto.name)}</h3>

            ${
              producto.brand
                ? `<p>${escaparHTML(producto.brand)}</p>`
                : ""
            }

            ${
              producto.presentation
                ? `<p>${escaparHTML(producto.presentation)}</p>`
                : ""
            }

            <div class="price">
              ${formatoPrecio(producto.price)}
            </div>

            <p class="product-stock">
              ${
                agotado
                  ? "Agotado"
                  : `Disponibles: ${producto.stock}`
              }
            </p>

            ${
              agotado
                ? `<button class="add-button" disabled>Agotado</button>`
                : cantidad > 0
                  ? `
                    <div class="product-quantity">
                      <button
                        type="button"
                        data-product-change="${escaparHTML(producto.id)}"
                        data-delta="-1"
                        aria-label="Restar"
                      >−</button>

                      <span>${cantidad}</span>

                      <button
                        type="button"
                        data-product-change="${escaparHTML(producto.id)}"
                        data-delta="1"
                        aria-label="Añadir"
                        ${cantidad >= producto.stock ? "disabled" : ""}
                      >+</button>
                    </div>
                  `
                  : `
                    <button
                      class="add-button"
                      type="button"
                      data-add="${escaparHTML(producto.id)}"
                    >Añadir a mi jaba</button>
                  `
            }
          </div>
        </article>
      `;
    }).join("");
  }

  // ---------------------------------------------------------
  // AÑADIR Y MODIFICAR CANTIDADES
  // ---------------------------------------------------------

  function addToCart(id) {
    const producto = products.find(p => p.id === String(id));

    if (!producto || producto.stock <= 0) return;

    const cantidadActual = cart.get(producto.id) || 0;

    if (cantidadActual >= producto.stock) {
      alert("No quedan más unidades disponibles.");
      return;
    }

    cart.set(producto.id, cantidadActual + 1);

    guardarCarrito();
    renderProducts();
    renderCart();
  }

  function changeQuantity(id, delta) {
    const producto = products.find(p => p.id === String(id));

    if (!producto) return;

    const cantidadActual = cart.get(producto.id) || 0;
    const nuevaCantidad = cantidadActual + Number(delta);

    if (nuevaCantidad <= 0) {
      cart.delete(producto.id);
    } else if (nuevaCantidad <= producto.stock) {
      cart.set(producto.id, nuevaCantidad);
    } else {
      return;
    }

    guardarCarrito();
    renderProducts();
    renderCart();
  }

  // ---------------------------------------------------------
  // MOSTRAR EL CARRITO
  // ---------------------------------------------------------

  function renderCart() {
    const cantidadTotal = [...cart.values()]
      .reduce((suma, cantidad) => suma + cantidad, 0);

    document.getElementById("cart-count").textContent =
      cantidadTotal;

    const items = document.getElementById("cart-items");
    const total = document.getElementById("cart-total");

    if (cart.size === 0) {
      items.innerHTML = `
        <div class="cart-empty">
          <div style="font-size:48px">🧺</div>
          <h3>Tu jaba está vacía</h3>
          <p>¡Vamos a buscar lo que necesitas!</p>
        </div>`;

      total.innerHTML = "";
      return;
    }

    let importeTotal = 0;

    items.innerHTML = [...cart.entries()].map(([id, cantidad]) => {
      const producto = products.find(p => p.id === id);

      if (!producto) return "";

      const subtotal = producto.price * cantidad;
      importeTotal += subtotal;

      return `
        <div class="cart-item">
          <div>
            <strong>${escaparHTML(producto.name)}</strong>

            <small>
              ${formatoPrecio(producto.price)} × ${cantidad}
            </small>

            <div class="quantity">
              <button
                type="button"
                data-change="${escaparHTML(id)}"
                data-delta="-1"
                aria-label="Restar"
              >−</button>

              <span>${cantidad}</span>

              <button
                type="button"
                data-change="${escaparHTML(id)}"
                data-delta="1"
                aria-label="Añadir"
                ${cantidad >= producto.stock ? "disabled" : ""}
              >+</button>
            </div>
          </div>

          <div>
            <strong>${formatoPrecio(subtotal)}</strong>

            <button
              type="button"
              data-remove="${escaparHTML(id)}"
              aria-label="Eliminar producto"
              style="border:0;background:none"
            >🗑️</button>
          </div>
        </div>`;
    }).join("");

    total.innerHTML = `
      <p>
        <strong>Total: ${formatoPrecio(importeTotal)}</strong>
      </p>
      <button class="checkout" id="prepare-order">
        Enviar pedido por WhatsApp
      </button>`;
  }

  // ---------------------------------------------------------
  // EVENTOS DE LAS TARJETAS Y DEL CARRITO
  // ---------------------------------------------------------

  grid.addEventListener("click", evento => {
    const botonAgregar = evento.target.closest("[data-add]");
    const botonCantidad = evento.target.closest("[data-product-change]");

    if (botonAgregar) {
      addToCart(botonAgregar.dataset.add);
      return;
    }

    if (botonCantidad) {
      changeQuantity(
        botonCantidad.dataset.productChange,
        Number(botonCantidad.dataset.delta)
      );
    }
  });

  document.getElementById("cart-items").addEventListener(
    "click",
    evento => {
      const cambiar = evento.target.closest("[data-change]");
      const eliminar = evento.target.closest("[data-remove]");

      if (cambiar) {
        changeQuantity(
          cambiar.dataset.change,
          Number(cambiar.dataset.delta)
        );
      }

      if (eliminar) {
        cart.delete(String(eliminar.dataset.remove));
        guardarCarrito();
        renderProducts();
        renderCart();
      }
    }
  );

  // ---------------------------------------------------------
  // BÚSQUEDA Y CATEGORÍAS
  // ---------------------------------------------------------

  const formularioBusqueda = document.getElementById("search-form");

  formularioBusqueda.addEventListener("submit", evento => {
    evento.preventDefault();

    searchTerm = document.getElementById("search-input")
      .value.trim().toLowerCase();

    renderProducts();
  });

  document.getElementById("search-input").addEventListener(
    "input",
    evento => {
      searchTerm = evento.target.value.trim().toLowerCase();
      renderProducts();
    }
  );

  document.getElementById("categories").addEventListener(
    "click",
    evento => {
      const boton = evento.target.closest("[data-category]");

      if (!boton) return;

      selectedCategory = boton.dataset.category;

      document.querySelectorAll(".category-button").forEach(elemento => {
        elemento.classList.toggle(
          "active",
          elemento.dataset.category === selectedCategory
        );
      });

      renderProducts();
    }
  );

  // ---------------------------------------------------------
  // ABRIR Y CERRAR LA JABA
  // ---------------------------------------------------------

  document.getElementById("open-cart").addEventListener("click", () => {
    cartOverlay.classList.add("open");
    cartOverlay.setAttribute("aria-hidden", "false");
  });

  function closeCart() {
    cartOverlay.classList.remove("open");
    cartOverlay.setAttribute("aria-hidden", "true");
  }

  document.getElementById("close-cart").addEventListener(
    "click",
    closeCart
  );

  cartOverlay.addEventListener("click", evento => {
    if (evento.target === cartOverlay) closeCart();
  });

  // ---------------------------------------------------------
  // PREPARAR EL PEDIDO POR WHATSAPP
  // ---------------------------------------------------------

  document.getElementById("cart-total").addEventListener(
    "click",
    evento => {
      if (evento.target.id !== "prepare-order") return;

      if (cart.size === 0) {
        alert("Tu jaba está vacía.");
        return;
      }

      const lineas = [...cart.entries()].map(([id, cantidad]) => {
        const producto = products.find(p => p.id === id);

        if (!producto) return "";

        return `• ${producto.name} — ${cantidad} × ` +
          `${formatoPrecio(producto.price)} = ` +
          `${formatoPrecio(producto.price * cantidad)}`;
      }).filter(Boolean);

      const total = [...cart.entries()].reduce((suma, [id, cantidad]) => {
        const producto = products.find(p => p.id === id);
        return suma + (producto ? producto.price * cantidad : 0);
      }, 0);

      const mensaje = [
        "¡Hola, El Plan Jaba! 🛍️",
        "Quiero confirmar este pedido:",
        "",
        ...lineas,
        "",
        `Total calculado: ${formatoPrecio(total)}`,
        "Por favor, confirmen disponibilidad y entrega."
      ].join("\n");

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${
        encodeURIComponent(mensaje)
      }`;

      window.open(url, "_blank", "noopener,noreferrer");
    }
  );

  // ---------------------------------------------------------
  // VENTANA DE CUENTA: LA COMPRA COMO INVITADO SE MANTIENE
  // ---------------------------------------------------------

  const accountOverlay = document.getElementById("account-overlay");

  document.querySelectorAll("[data-account]").forEach(boton => {
    boton.addEventListener("click", () => {
      const registro = boton.dataset.account === "signup";

      document.getElementById("account-title").textContent =
        registro ? "Crear cuenta" : "Iniciar sesión";

      document.getElementById("account-message").textContent =
        "Puedes preparar tu compra como invitado. " +
        "La gestión de cuentas todavía no está activa.";

      accountOverlay.classList.add("open");
      accountOverlay.setAttribute("aria-hidden", "false");
    });
  });

  function closeAccount() {
    accountOverlay.classList.remove("open");
    accountOverlay.setAttribute("aria-hidden", "true");
  }

  document.getElementById("close-account").addEventListener(
    "click",
    closeAccount
  );

  document.getElementById("continue-guest").addEventListener(
    "click",
    closeAccount
  );

  accountOverlay.addEventListener("click", evento => {
    if (evento.target === accountOverlay) closeAccount();
  });

  // ---------------------------------------------------------
  // ARRANCAR
  // ---------------------------------------------------------

  cargarProductos();
</script>
